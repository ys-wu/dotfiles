# True color — so Powerlevel10k's colors render correctly inside tmux
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# Modified keys (Shift+Enter, Ctrl+Shift+..) reach apps inside tmux.
# Ghostty speaks the kitty/xterm key protocols, but tmux drops the modifiers
# unless told the outer terminal supports them. "on" only forwards extended
# keys to apps that ask for them (Claude Code sends CSI >4;2m at startup).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Vi-style copy mode (this is your Vim navigation of scrollback)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Sensible defaults
set -g base-index 1          # windows start at 1, not 0
setw -g pane-base-index 1
set -g mouse on              # scroll + click panes
set -sg escape-time 10       # snappier Esc, helps nvim inside tmux

