# Prefix: left at tmux's default Ctrl+b.

# True color — so Powerlevel10k's colors render correctly inside tmux
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# Modified keys (Shift+Enter, Ctrl+Shift+..) reach apps inside tmux.
# This is xterm's modifyOtherKeys, not the Kitty keyboard protocol; csi-u is
# only the wire format tmux uses for it.
#   always  forces mode 1 even for apps whose opt-in never reaches tmux (Codex).
#           Mode 1 rewrites only keys with no legacy byte sequence, so
#           Enter/Tab/Esc/C-c are untouched; apps can still request mode 2.
#   csi-u   encodes Shift+Enter as ^[[13;2u, which modern TUIs parse. tmux's
#           default (xterm: ^[[27;2;13~) is recognised by fewer of them.
# extkeys tells tmux the outer terminal (xterm-ghostty) can report them at all.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Vi-style copy mode (this is your Vim navigation of scrollback)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Sensible defaults
set -g base-index 1          # windows start at 1, not 0
setw -g pane-base-index 1
set -g mouse on              # scroll + click panes
set -sg escape-time 10       # snappier Esc, helps nvim inside tmux

# Plugins, loaded by TPM. The repos themselves are cloned by chezmoi
# (.chezmoiexternal.toml), not by TPM's `prefix + I`, so a fresh machine is
# fully set up by `chezmoi apply` with no manual install step.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix+C-s save, prefix+C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15m + restore on start

set -g @resurrect-capture-pane-contents 'on'   # also save each pane's scrollback
set -g @continuum-restore 'on'                 # restore the last save when tmux starts

# Keep last: tpm sources every plugin declared above.
run '~/.tmux/plugins/tpm/tpm'
